[project]
name = "vocab"
version = "0.1.0"
description = "Local-first English vocabulary learning tool for Turkish speakers"
readme = "README.md"
requires-python = ">=3.12"
# Dependencies are added milestone by milestone, only when code first needs them.
dependencies = [
    "typer>=0.12",
]

# Installs a `vocab` command that calls the Typer app object in src/vocab/cli.py.
[project.scripts]
vocab = "vocab.cli:app"

# Tools needed only for development, not for running the app.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: basic errors, I: import order, UP: modern Python syntax, B: likely bugs.
select = ["E", "F", "I", "UP", "B"]
