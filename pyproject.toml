[project]
name = "vocab"
version = "0.1.0"
description = "Local-first English vocabulary learning tool for Turkish speakers"
readme = "README.md"
requires-python = ">=3.12"
# Dependencies are added milestone by milestone, only when code first needs them.
dependencies = [
    "en-core-web-sm",
    "spacy>=3.8.18,<3.9",  # must match the en-core-web-sm version below
    "typer>=0.12",
    "wordfreq>=3.1.1",
]

# Installs a `vocab` command that calls the Typer app object in src/vocab/cli.py.
[project.scripts]
vocab = "vocab.cli:app"

# Tools needed only for development, not for running the app.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: basic errors, I: import order, UP: modern Python syntax, B: likely bugs.
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
